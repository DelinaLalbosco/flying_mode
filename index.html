<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beautiful Waterfall</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#bde9ff, #e8f8ff);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #176b87;
        }

        img {
            width: 100%;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🌊 Beautiful Waterfall</h1>

        <img
            src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=1200&q=80"
            alt="Beautiful waterfall">

        <p>Welcome to the waterfall!</p>
    </div>

</body>
</html>
